
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
.statement-alert {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 24px;
  border-radius: 16px;
  background: linear-gradient(135deg, #0646a5, #1685ee);
  color: white;
  font-family: Arial, sans-serif;
  box-shadow: 0 8px 25px rgba(0, 90, 210, 0.25);
  animation: appear 0.6s ease-out;
}

.statement-icon {
  font-size: 36px;
  background: rgba(255,255,255,0.16);
  padding: 14px;
  border-radius: 12px;
}

.statement-alert h3 {
  margin: 0 0 8px;
  font-size: 20px;
}

.statement-alert p {
  margin: 0;
  font-size: 15px;
  line-height: 1.6;
  color: #e2efff;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="statement-alert" role="status">
  <div class="statement-icon">📥</div>
  <div>
    <h3>✓ Your Statement Is Ready!</h3>
    <p>
      Please check your <strong>Downloads folder</strong>
      to find your statement.
    </p>
  </div>
</div>

</body>
</html>
